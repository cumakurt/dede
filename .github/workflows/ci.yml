name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python }}-${{ hashFiles('**/requirements-*.lock') }}
          restore-keys: pip-${{ matrix.python }}-
      - name: Install package + dev deps
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Test
        run: |
          if [ "${{ matrix.python }}" = "3.12" ]; then
            make test
          else
            python -m pytest -q tests/unit/test_config.py tests/unit/test_engine_hardening.py
          fi

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Offline verification
        run: make test-offline

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate compose config
        run: docker compose config --quiet

  rules-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install rule validation dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-scanner.lock
      - name: Validate rule manifest integrity
        run: python scripts/validate_release.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, offline, docker-config, rules-manifest]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked release tooling
        run: |
          python -m pip install "uv==0.10.2"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify release tag
        run: |
          python scripts/validate_release.py --tag "$GITHUB_REF_NAME"
          python -c 'import tomllib; print("RELEASE_VERSION=" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' >> "$GITHUB_ENV"
      - name: Run release gates
        run: make release-check
      - name: Install and smoke test the built wheel outside the checkout
        run: |
          python -m pip install --no-deps --force-reinstall "dist/$RELEASE_VERSION/dede-$RELEASE_VERSION-py3-none-any.whl"
          cd "$(mktemp -d)"
          python -c 'import dede; from pathlib import Path; from dede.engine.rules import load_rules_dir; bundles = load_rules_dir(Path(dede.__file__).parent / "bundled_rules/dede-engine"); assert sum(len(b.rules) for b in bundles) == 243'
          dede --help
      - name: Build release scanner image
        run: docker compose build scanner
      - name: Smoke test bundled native engine in image
        run: |
          docker run --rm --network none --entrypoint python dede-scanner:1.10.0 -c '
          from pathlib import Path
          from dede.engine.rules import load_rules_dir
          rules = load_rules_dir(Path("/rules/dede-engine"))
          assert len(rules) == 12, len(rules)
          assert sum(len(bundle.rules) for bundle in rules) == 243
          print("native image catalog OK")
          '
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          syft-version: v1.42.0
      - name: Generate image SBOMs
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          DEDE_SBOM_DIR: ${{ github.workspace }}/dist/sbom
        run: |
          syft_dir="$(dirname "$SYFT_CMD")"
          export PATH="$syft_dir:$PATH"
          make sbom
      - name: Strict image and source security audit
        run: make security-audit
      - name: Preserve audit evidence even when the release is blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dede-${{ github.ref_name }}-audit
          path: |
            dist/security/
            dist/sbom/
          if-no-files-found: warn
      - name: Generate checksums
        run: |
          cd "dist/$RELEASE_VERSION"
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Attest validated release packages
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/${{ env.RELEASE_VERSION }}/*.whl
            dist/${{ env.RELEASE_VERSION }}/*.tar.gz
            dist/sbom/*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dede-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
