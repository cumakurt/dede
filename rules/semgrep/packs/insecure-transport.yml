        rv_id: 1263329
        rule_id: 7KUQAE
        version_id: 9lT4bNd
        url: https://semgrep.dev/playground/r/9lT4bNd/problem-based-packs.insecure-transport.js-node.using-http-server.using-http-server
        origin: community
  languages:
