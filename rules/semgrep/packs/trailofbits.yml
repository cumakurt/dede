    - https://www.mikeperham.com/2015/05/08/timeout-rubys-most-dangerous-api/
    - http://blog.headius.com/2008/02/rubys-threadraise-threadkill-timeoutrb.html
    license: AGPL-3.0 license
    vulnerability_class:
