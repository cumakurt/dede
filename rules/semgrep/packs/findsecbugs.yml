        r_id: 21225
        rv_id: 920197
        rule_id: oqUKxo
        version_id: PkTjGdq
        url: https://semgrep.dev/playground/r/PkTjGdq/gitlab.find_sec_bugs.INSECURE_SMTP_SSL-1
        origin: community
