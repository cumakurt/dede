      - pattern: $HTTP.GetAsync($INPUT, ...)
      - pattern: $HTTP.GetStringAsync($INPUT, ...)
      - pattern: $HTTP.GetByteArrayAsync($INPUT, ...)
      - pattern: $HTTP.PostAsync($INPUT, ...)
      - pattern: new HttpRequestMessage($METHOD, $INPUT)
    - focus-metavariable: $INPUT
- id: dede.csharp.advanced.xss
  languages:
  - csharp
  severity: ERROR
  message: Request data reaches unencoded HTML output.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - CWE-79
    owasp:
    - A05:2025
    standards:
      owasp-asvs-5.0.0:
      - v5.0.0-1.2.1
      microsoft-dotnet:
      - CA3002
    recommendation: Use framework output encoding. HTML encoding is only a sanitizer for HTML text, not
      JavaScript, CSS or URLs.
    references:
    - https://cwe.mitre.org/data/definitions/79.html
    - https://owasp.org/Top10/2025/
    - https://github.com/OWASP/ASVS/releases/tag/v5.0.0_release
    - https://learn.microsoft.com/en-us/dotnet/fundamentals/code-analysis/quality-rules/ca3002
    analysis: taint
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: Request.Query[$KEY]
    - pattern: Request.QueryString[$KEY]
    - pattern: Request.Form[$KEY]
    - pattern: Request.Headers[$KEY]
    - pattern: Request.Cookies[$KEY]
    - pattern: $CTX.Request.Query[$KEY]
    - pattern: $CTX.Request.QueryString[$KEY]
    - pattern: $CTX.Request.Form[$KEY]
    - pattern: $CTX.Request.Headers[$KEY]
    - pattern: $CTX.Request.Cookies[$KEY]
    exact: true
  - patterns:
    - pattern-inside: $RET $METHOD(..., [$ATTR] $TYPE $PARAM, ...) { ... }
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(FromQuery|FromRoute|FromBody|FromForm|FromHeader)$
    - focus-metavariable: $PARAM
    exact: true
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Html.Raw($INPUT)
      - pattern: $HTML.Raw($INPUT)
      - pattern: Response.Write($INPUT)
      - pattern: $CTX.Response.WriteAsync($INPUT)
    - focus-metavariable: $INPUT
  pattern-sanitizers:
  - pattern: System.Net.WebUtility.HtmlEncode(...)
    exact: true
  - pattern: System.Web.HttpUtility.HtmlEncode(...)
    exact: true
  - pattern: System.Text.Encodings.Web.HtmlEncoder.Default.Encode(...)
    exact: true
