rules:
- id: dede.csharp.advanced.sql-injection
  languages:
  - csharp
  severity: ERROR
  message: Request data reaches SQL command text.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - CWE-89
    owasp:
    - A05:2025
    standards:
      owasp-asvs-5.0.0:
      - v5.0.0-1.2.4
      microsoft-dotnet:
      - CA3001
    recommendation: Use constant SQL with bound parameters; use EF Core interpolated APIs with FormattableString,
      not interpolated raw SQL.
    references:
    - https://cwe.mitre.org/data/definitions/89.html
    - https://owasp.org/Top10/2025/
    - https://github.com/OWASP/ASVS/releases/tag/v5.0.0_release
    - https://learn.microsoft.com/en-us/dotnet/fundamentals/code-analysis/quality-rules/ca3001
    analysis: taint
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: Request.Query[$KEY]
    - pattern: Request.QueryString[$KEY]
    - pattern: Request.Form[$KEY]
    - pattern: Request.Headers[$KEY]
    - pattern: Request.Cookies[$KEY]
    - pattern: $CTX.Request.Query[$KEY]
    - pattern: $CTX.Request.QueryString[$KEY]
    - pattern: $CTX.Request.Form[$KEY]
    - pattern: $CTX.Request.Headers[$KEY]
    - pattern: $CTX.Request.Cookies[$KEY]
    exact: true
  - patterns:
    - pattern-inside: $RET $METHOD(..., [$ATTR] $TYPE $PARAM, ...) { ... }
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(FromQuery|FromRoute|FromBody|FromForm|FromHeader)$
    - focus-metavariable: $PARAM
    exact: true
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: new SqlCommand($INPUT, ...)
      - pattern: new Microsoft.Data.SqlClient.SqlCommand($INPUT, ...)
      - pattern: $CMD.CommandText = $INPUT
      - pattern: $DB.FromSqlRaw($INPUT, ...)
      - pattern: $DB.ExecuteSqlRaw($INPUT, ...)
      - pattern: $DB.Query($INPUT, ...)
      - pattern: $DB.Execute($INPUT, ...)
      - pattern: new System.Data.SqlClient.SqlCommand($INPUT, ...)
    - focus-metavariable: $INPUT
- id: dede.csharp.advanced.command-injection
  languages:
  - csharp
  severity: ERROR
  message: Request data controls a process executable or command argument string.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - CWE-78
    owasp:
    - A05:2025
    standards:
      owasp-asvs-5.0.0:
      - v5.0.0-1.2.5
      microsoft-dotnet:
      - CA3006
    recommendation: Use a fixed executable, avoid shells, and validate individual ArgumentList entries.
    references:
    - https://cwe.mitre.org/data/definitions/78.html
    - https://owasp.org/Top10/2025/
    - https://github.com/OWASP/ASVS/releases/tag/v5.0.0_release
    - https://learn.microsoft.com/en-us/dotnet/fundamentals/code-analysis/quality-rules/ca3006
    analysis: taint
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: Request.Query[$KEY]
    - pattern: Request.QueryString[$KEY]
    - pattern: Request.Form[$KEY]
    - pattern: Request.Headers[$KEY]
    - pattern: Request.Cookies[$KEY]
    - pattern: $CTX.Request.Query[$KEY]
    - pattern: $CTX.Request.QueryString[$KEY]
    - pattern: $CTX.Request.Form[$KEY]
    - pattern: $CTX.Request.Headers[$KEY]
    - pattern: $CTX.Request.Cookies[$KEY]
    exact: true
  - patterns:
    - pattern-inside: $RET $METHOD(..., [$ATTR] $TYPE $PARAM, ...) { ... }
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(FromQuery|FromRoute|FromBody|FromForm|FromHeader)$
    - focus-metavariable: $PARAM
    exact: true
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Process.Start($INPUT, ...)
      - pattern: Process.Start($EXE, $INPUT)
      - pattern: $PSI.FileName = $INPUT
      - pattern: $PSI.Arguments = $INPUT
      - pattern: new ProcessStartInfo($INPUT, ...)
      - pattern: new ProcessStartInfo($EXE, $INPUT)
    - focus-metavariable: $INPUT
- id: dede.csharp.advanced.path-traversal
  languages:
  - csharp
  severity: ERROR
  message: Request data controls a filesystem path.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - CWE-22
    owasp:
    - A01:2025
    standards:
      owasp-asvs-5.0.0:
      - v5.0.0-5.3.2
      microsoft-dotnet:
      - CA3003
    recommendation: Use server-generated filenames or enforce canonical path containment under an authorized
      directory. Path.Combine/GetFullPath alone do not establish containment.
    references:
    - https://cwe.mitre.org/data/definitions/22.html
    - https://owasp.org/Top10/2025/
    - https://github.com/OWASP/ASVS/releases/tag/v5.0.0_release
    - https://learn.microsoft.com/en-us/dotnet/fundamentals/code-analysis/quality-rules/ca3003
    analysis: taint
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: Request.Query[$KEY]
    - pattern: Request.QueryString[$KEY]
    - pattern: Request.Form[$KEY]
    - pattern: Request.Headers[$KEY]
    - pattern: Request.Cookies[$KEY]
    - pattern: $CTX.Request.Query[$KEY]
    - pattern: $CTX.Request.QueryString[$KEY]
    - pattern: $CTX.Request.Form[$KEY]
    - pattern: $CTX.Request.Headers[$KEY]
    - pattern: $CTX.Request.Cookies[$KEY]
    exact: true
  - patterns:
    - pattern-inside: $RET $METHOD(..., [$ATTR] $TYPE $PARAM, ...) { ... }
    - metavariable-regex:
        metavariable: $ATTR
        regex: ^(FromQuery|FromRoute|FromBody|FromForm|FromHeader)$
    - focus-metavariable: $PARAM
    exact: true
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: File.ReadAllText($INPUT, ...)
      - pattern: File.ReadAllBytes($INPUT, ...)
      - pattern: File.OpenRead($INPUT)
      - pattern: File.WriteAllText($INPUT, ...)
      - pattern: new FileStream($INPUT, ...)
      - pattern: PhysicalFile($INPUT, ...)
    - focus-metavariable: $INPUT
