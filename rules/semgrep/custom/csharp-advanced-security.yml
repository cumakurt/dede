  - pattern-either:
    - pattern: Request.Query[$KEY]
    - pattern: Request.QueryString[$KEY]
    - pattern: Request.Form[$KEY]
    - pattern: Request.Headers[$KEY]
    - pattern: Request.Cookies[$KEY]
    - pattern: $CTX.Request.Query[$KEY]
    - pattern: $CTX.Request.QueryString[$KEY]
    - pattern: $CTX.Request.Form[$KEY]
    - pattern: $CTX.Request.Headers[$KEY]
    - pattern: $CTX.Request.Cookies[$KEY]
