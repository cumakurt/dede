[build-system]
requires = ["hatchling>=1.25.0,<1.29"]
build-backend = "hatchling.build"

[project]
name = "dede"
version = "1.10.0"
description = "Fully offline static code analysis with optional Docker isolation and local LLM enrichment"
readme = "README.md"
license = "AGPL-3.0-only"
keywords = ["static-analysis", "security", "sast", "code-scanning", "offline"]
requires-python = ">=3.12"
authors = [{ name = "Cuma KURT", email = "cumakurt@gmail.com" }]
maintainers = [{ name = "Cuma KURT", email = "cumakurt@gmail.com" }]
dependencies = [
  "typer>=0.27.2,<0.28",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.5.0,<3",
  "PyYAML>=6.0.2,<7",
  "httpx>=0.27.2,<0.29",
  "Jinja2>=3.1.4,<4",
  "pathspec>=0.12.1,<0.13",
  "rich>=13.5.2,<14",
]

[project.optional-dependencies]
reporting = [
  "WeasyPrint>=68,<71",
]
# External analyzer and PDF dependencies remain optional. The host install
# always includes the deterministic native scanner; Docker is only an isolation/runtime option.
scanner = [
  "WeasyPrint>=68,<71",
  "bandit>=1.7.10,<2",
  "ruff>=0.6.9,<0.9",
  "lizard>=1.17.10,<2",
  # Keep the scanner toolchain in the lockfile as well as the application
  # dependencies. Semgrep's telemetry imports are pinned as part of that set.
  "semgrep==1.177.0",
  "setuptools==84.0.0",
  "opentelemetry-instrumentation-requests~=0.58b0",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.6.9,<0.10",
  # mypy 1.16+ requires pathspec >=1, while runtime supports pathspec <0.13.
  "mypy>=1.11,<1.16",
  "types-PyYAML>=6.0.12,<7",
  "build>=1.2,<2",
  "twine>=6.0,<7",
  "pytest-xdist>=3.6,<4",
]

[project.urls]
Homepage = "https://github.com/cumakurt/dede"
Repository = "https://github.com/cumakurt/dede"
Issues = "https://github.com/cumakurt/dede/issues"
LinkedIn = "https://www.linkedin.com/in/cuma-kurt-34414917/"

[project.scripts]
dede = "dede.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dede"]

[tool.hatch.build.targets.wheel.force-include]
"rules/semgrep" = "dede/bundled_rules"
"rules/dede-engine" = "dede/bundled_rules/dede-engine"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: integration tests that run analyzers on fixtures",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
prerelease = "if-necessary"

# Third-party packages can register Analyzer implementations via the
# ``dede.analyzers`` entry-point group. No plugin is required for core scans.
